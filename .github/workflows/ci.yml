# Comprobaciones en cada push a dev/main y en cada PR.
#
# Equivale a `make check` mas los tests, pero en nativo: `make check` corre
# dentro de Docker Compose y en CI obligaria a construir las imagenes en cada
# ejecucion. El frontend se compila primero porque el backend lo embebe
# (rust-embed exige que exista frontend/dist); `pnpm build` ya pasa ESLint.

name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # El test del export SQL necesita un PostgreSQL; los demas no.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sandbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - uses: ./.github/actions/frontend
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path backend/Cargo.toml
        env:
          PH_TEST_PG_HOST: localhost

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - uses: ./.github/actions/frontend
      # Solo el crate desktop/: el backend no esta formateado con rustfmt.
      - run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings
