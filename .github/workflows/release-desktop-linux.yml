# App de escritorio para Linux (x86_64 y ARM64): .AppImage, .deb y .rpm.
#
# Cada arquitectura en su runner nativo: Tauri enlaza contra el WebKitGTK del
# sistema, asi que no hay compilacion cruzada. Ubuntu 22.04 para que el
# resultado funcione tambien en distribuciones con glibc mas antigua.
# En Linux no hay firma de codigo; solo el updater, si esta configurado
# (TAURI_SIGNING_PRIVATE_KEY + _PASSWORD). Detalle en docs/desktop.md.
#
# Lo llama release.yml con cada tag. Tambien se puede lanzar a mano desde la
# pestana Actions para probarlo: deja los bundles como artefactos del run, sin
# publicar nada.

name: release · desktop linux

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-22.04 }
          # El runner ARM de GitHub solo esta disponible en repos publicos.
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils \
            perl make pkg-config
      - uses: ./.github/actions/frontend
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: linux-${{ matrix.arch }}

      # Exporta solo los secrets que existen (uno ausente llega como cadena
      # vacia y Tauri lo trataria como configurado) y compone los --config
      # extra para tauri build.
      - name: Updater setup
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export_env() {
            local name="$1" value="$2" delim
            delim="EOF_$(openssl rand -hex 8)"
            { echo "${name}<<${delim}"; printf '%s\n' "$value"; echo "$delim"; } >> "$GITHUB_ENV"
          }
          extra=""

          # Updater (igual en las tres plataformas)
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if grep -q '"pubkey": ""' desktop/tauri.updater.conf.json; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but desktop/tauri.updater.conf.json has an empty pubkey"
              exit 1
            fi
            echo "Updater: signed update artifacts enabled"
            export_env TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              export_env TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            fi
            extra="$extra --config tauri.updater.conf.json"
          else
            echo "::warning::Updater: TAURI_SIGNING_PRIVATE_KEY not set, no update artifacts"
          fi

          echo "args=${extra# }" >> "$GITHUB_OUTPUT"

      - name: Build bundles
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.4 build ${{ steps.signing.outputs.args }}

      # Copia los bundles a dist/ como postgre-hub-desktop-linux-<arch>.<ext>.
      - name: Package
        run: make package-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
