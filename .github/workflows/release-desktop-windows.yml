# App de escritorio para Windows (x86_64): instalador NSIS (.exe) y .msi.
#
# Se compila en un runner Windows (toolchain MSVC): necesita WebView2 y las
# herramientas de empaquetado de Windows.
#
# Firma, opcional: con Azure Artifact Signing si existen
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID (secrets) y
#   AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE (variables).
# Sin ellos, instaladores sin firmar (SmartScreen avisa).
# Updater: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD). Detalle en docs/desktop.md.
#
# Lo llama release.yml con cada tag. Tambien se puede lanzar a mano desde la
# pestana Actions para probarlo: deja los instaladores como artefactos del
# run, sin publicar nada.

name: release · desktop windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: windows-x86_64

      # Exporta solo los secrets que existen (uno ausente llega como cadena
      # vacia y Tauri lo trataria como configurado) y compone los --config
      # extra para tauri build.
      - name: Signing and updater setup
        id: signing
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export_env() {
            local name="$1" value="$2" delim
            delim="EOF_$(openssl rand -hex 8)"
            { echo "${name}<<${delim}"; printf '%s\n' "$value"; echo "$delim"; } >> "$GITHUB_ENV"
          }
          extra=""

          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TENANT_ID" ] \
             && [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_SIGNING_ACCOUNT" ] && [ -n "$AZURE_SIGNING_PROFILE" ]; then
            echo "Windows: signing with Azure Artifact Signing"
            export_env AZURE_CLIENT_ID "$AZURE_CLIENT_ID"
            export_env AZURE_CLIENT_SECRET "$AZURE_CLIENT_SECRET"
            export_env AZURE_TENANT_ID "$AZURE_TENANT_ID"
            cmd="artifact-signing-cli -e ${AZURE_SIGNING_ENDPOINT} -a ${AZURE_SIGNING_ACCOUNT} -c ${AZURE_SIGNING_PROFILE} -d Postgre-Hub %1"
            printf '{"bundle":{"windows":{"signCommand":"%s"}}}\n' "$cmd" > "$RUNNER_TEMP/tauri.winsign.conf.json"
            extra="$extra --config $RUNNER_TEMP/tauri.winsign.conf.json"
            echo "install_signer=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Azure Artifact Signing not configured, building unsigned installers"
          fi

          # Updater (igual en las tres plataformas)
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if grep -q '"pubkey": ""' desktop/tauri.updater.conf.json; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but desktop/tauri.updater.conf.json has an empty pubkey"
              exit 1
            fi
            echo "Updater: signed update artifacts enabled"
            export_env TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              export_env TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            fi
            extra="$extra --config tauri.updater.conf.json"
          else
            echo "::warning::Updater: TAURI_SIGNING_PRIVATE_KEY not set, no update artifacts"
          fi

          echo "args=${extra# }" >> "$GITHUB_OUTPUT"

      - name: Install Azure Artifact Signing CLI
        if: steps.signing.outputs.install_signer == 'true'
        run: cargo install artifact-signing-cli --locked

      - name: Build bundles
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.4 build ${{ steps.signing.outputs.args }}

      # Copia los bundles a dist/ como postgre-hub-desktop-windows-x86_64.<ext>.
      # SHELL=bash: make.exe no puede abrir /bin/bash (ruta Unix del Makefile)
      # y asi lo busca en el PATH.
      - name: Package
        run: |
          command -v make >/dev/null || choco install make -y --no-progress
          make package-desktop SHELL=bash

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: dist/*
          if-no-files-found: error
