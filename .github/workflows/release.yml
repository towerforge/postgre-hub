# Release: lo dispara `make release`, que crea el tag vX.Y.Z y lo sube.
#
#   version ──┬── binaries-linux     6 binarios de navegador (.tar.gz)
#             ├── binaries-macos     2 binarios de navegador (.tar.gz)
#             ├── binaries-windows   2 binarios de navegador (.zip)
#             ├── desktop-macos      app .dmg (Apple Silicon e Intel)
#             ├── desktop-linux      app .AppImage/.deb/.rpm (x86_64 y ARM64)
#             └── desktop-windows    app .exe/.msi (x86_64)
#                         │
#                      publish       checksums, latest.json y release de GitHub
#
# Cada parte esta en su propio fichero (release-<parte>.yml) y se puede lanzar
# sola desde la pestana Actions para probarla sin crear un tag. Aqui solo se
# encadenan: si cualquiera falla, no se publica nada.

name: release

on:
  push:
    tags: ["v*"]

# Solo lectura por defecto: unicamente `publish` escribe en el repo (crea la
# release). Las partes ejecutan acciones de terceros y dependencias de build,
# y no necesitan el token con escritura.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Falla pronto si el tag no coincide con la version de los manifiestos.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches backend/Cargo.toml and frontend/package.json
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/Cargo.toml | head -n1)
          echo "tag: $GITHUB_REF_NAME, backend: $v"
          test "v$v" = "$GITHUB_REF_NAME"
          grep -q "\"version\": \"$v\"" frontend/package.json

  binaries-linux:
    needs: version
    uses: ./.github/workflows/release-binaries-linux.yml

  binaries-macos:
    needs: version
    uses: ./.github/workflows/release-binaries-macos.yml

  binaries-windows:
    needs: version
    uses: ./.github/workflows/release-binaries-windows.yml

  # Las apps reciben los secrets de firma y del updater.
  desktop-macos:
    needs: version
    uses: ./.github/workflows/release-desktop-macos.yml
    secrets: inherit

  desktop-linux:
    needs: version
    uses: ./.github/workflows/release-desktop-linux.yml
    secrets: inherit

  desktop-windows:
    needs: version
    uses: ./.github/workflows/release-desktop-windows.yml
    secrets: inherit

  publish:
    needs: [binaries-linux, binaries-macos, binaries-windows, desktop-macos, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Todos los artefactos de las partes del mismo run, juntos en dist/.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{binary,desktop}-*"
          merge-multiple: true

      - name: Checksums
        run: make checksums && cat dist/checksums.txt

      # Manifiesto del updater de Tauri, solo si hay firmas (.sig): sin
      # TAURI_SIGNING_PRIVATE_KEY no existe y la app no busca actualizaciones.
      # Artefacto de update por plataforma: .app.tar.gz en macOS, .AppImage en
      # Linux y el instalador NSIS en Windows.
      - name: Updater manifest
        run: |
          set -euo pipefail
          ls dist/*.sig >/dev/null 2>&1 || { echo "No .sig files: skipping latest.json"; exit 0; }
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          platforms='{}'
          for pair in darwin-aarch64:macos-aarch64.app.tar.gz darwin-x86_64:macos-x86_64.app.tar.gz \
                      linux-x86_64:linux-x86_64.AppImage linux-aarch64:linux-aarch64.AppImage \
                      windows-x86_64:windows-x86_64.exe; do
            key=${pair%%:*}
            file="postgre-hub-desktop-${pair#*:}"
            [ -f "dist/$file.sig" ] || continue
            platforms=$(jq --arg k "$key" --arg u "$base/$file" --rawfile s "dist/$file.sig" \
              '. + {($k): {url: $u, signature: ($s | rtrimstr("\n"))}}' <<<"$platforms")
          done
          jq -n --arg v "${GITHUB_REF_NAME#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson p "$platforms" '{version: $v, pub_date: $d, platforms: $p}' > dist/latest.json
          cat dist/latest.json

      - uses: softprops/action-gh-release@v2
        with:
          name: Postgre Hub ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.msi
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sig
            dist/checksums*.txt
            dist/latest.json
          fail_on_unmatched_files: false
          generate_release_notes: true
