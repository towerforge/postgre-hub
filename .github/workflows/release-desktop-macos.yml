# App de escritorio para macOS (Apple Silicon e Intel): .dmg, mas el
# .app.tar.gz del updater si esta configurado.
#
# Firma, opcional y por pasos segun los secrets que existan:
#   - sin secrets            firma ad hoc: Gatekeeper ofrece "Abrir igualmente"
#   - APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
#                            firmada con Developer ID
#   - y ademas APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_PRIVATE_KEY
#                            firmada y notarizada
# Updater: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD). Detalle en docs/desktop.md.
#
# Lo llama release.yml con cada tag. Tambien se puede lanzar a mano desde la
# pestana Actions para probarlo: deja los bundles como artefactos del run, sin
# publicar nada.

name: release · desktop macos

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: ${{ matrix.target }}

      # Exporta solo los secrets que existen (uno ausente llega como cadena
      # vacia y Tauri lo trataria como configurado) y compone los --config
      # extra para tauri build.
      - name: Signing and updater setup
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export_env() {
            local name="$1" value="$2" delim
            delim="EOF_$(openssl rand -hex 8)"
            { echo "${name}<<${delim}"; printf '%s\n' "$value"; echo "$delim"; } >> "$GITHUB_ENV"
          }
          extra=""

          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "macOS: signing with Developer ID"
            export_env APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            export_env APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            export_env APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
              echo "macOS: notarization enabled"
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
              printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
              export_env APPLE_API_ISSUER "$APPLE_API_ISSUER"
              export_env APPLE_API_KEY "$APPLE_API_KEY"
              export_env APPLE_API_KEY_PATH "$key_path"
            else
              echo "::warning::macOS: signed but not notarized (APPLE_API_* secrets missing)"
            fi
          else
            # Firma ad hoc: sin identidad de Apple, pero con el bundle sellado,
            # para que Gatekeeper ofrezca "Abrir igualmente" en vez de "danado".
            echo "::warning::macOS: no Apple certificate, building ad-hoc signed bundles"
            printf '{"bundle":{"macOS":{"signingIdentity":"-"}}}\n' > "$RUNNER_TEMP/tauri.adhoc.conf.json"
            extra="$extra --config $RUNNER_TEMP/tauri.adhoc.conf.json"
          fi

          # Updater (igual en las tres plataformas)
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if grep -q '"pubkey": ""' desktop/tauri.updater.conf.json; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but desktop/tauri.updater.conf.json has an empty pubkey"
              exit 1
            fi
            echo "Updater: signed update artifacts enabled"
            export_env TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              export_env TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            fi
            extra="$extra --config tauri.updater.conf.json"
          else
            echo "::warning::Updater: TAURI_SIGNING_PRIVATE_KEY not set, no update artifacts"
          fi

          echo "args=${extra# }" >> "$GITHUB_OUTPUT"

      - name: Build bundles
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.4 build --target ${{ matrix.target }} ${{ steps.signing.outputs.args }}

      # Copia los bundles a dist/ como postgre-hub-desktop-macos-<arch>.<ext>.
      - name: Package
        run: make package-desktop DESKTOP_TARGET=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
